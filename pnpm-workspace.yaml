packages:
  - 'apps/*'
  - 'libs/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: true
  esbuild: true
  less: true
  nx: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
