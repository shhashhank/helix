# Prometheus scrape config (HELIX-138): pull the metrics the OTel Collector
# exports on :8889 (everything Helix services send over OTLP), plus itself.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
