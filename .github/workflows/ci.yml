name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: typecheck + build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (registry)
        run: pnpm exec prisma generate --schema apps/registry/prisma/schema.prisma

      # Direct tsc (not `nx typecheck`, whose sync generator needs a root
      # tsconfig.json this workspace doesn't have). The spec config covers all
      # of src including the test files.
      - name: Typecheck (registry)
        run: pnpm exec tsc --noEmit -p apps/registry/tsconfig.spec.json

      - name: Typecheck (llm lib)
        run: pnpm exec tsc --noEmit -p libs/llm/tsconfig.spec.json

      - name: Typecheck (agent lib)
        run: pnpm exec tsc --noEmit -p libs/agent/tsconfig.spec.json

      - name: Typecheck (workflow lib)
        run: pnpm exec tsc --noEmit -p libs/workflow/tsconfig.spec.json

      - name: Typecheck (orchestrator)
        run: pnpm exec tsc --noEmit -p apps/orchestrator/tsconfig.spec.json

      - name: Typecheck (mcp lib)
        run: pnpm exec tsc --noEmit -p libs/mcp/tsconfig.spec.json

      - name: Typecheck (github-mcp lib)
        run: pnpm exec tsc --noEmit -p libs/github-mcp/tsconfig.spec.json

      - name: Typecheck (secrets lib)
        run: pnpm exec tsc --noEmit -p libs/secrets/tsconfig.spec.json

      - name: Typecheck (planning lib)
        run: pnpm exec tsc --noEmit -p libs/planning/tsconfig.spec.json

      - name: Typecheck (sandbox lib)
        run: pnpm exec tsc --noEmit -p libs/sandbox/tsconfig.spec.json

      - name: Typecheck (coding-agent lib)
        run: pnpm exec tsc --noEmit -p libs/coding-agent/tsconfig.spec.json

      - name: Typecheck (review-agent lib)
        run: pnpm exec tsc --noEmit -p libs/review-agent/tsconfig.spec.json

      - name: Typecheck (testing-agent lib)
        run: pnpm exec tsc --noEmit -p libs/testing-agent/tsconfig.spec.json

      - name: Typecheck (deployment-agent lib)
        run: pnpm exec tsc --noEmit -p libs/deployment-agent/tsconfig.spec.json

      - name: Typecheck (approvals lib)
        run: pnpm exec tsc --noEmit -p libs/approvals/tsconfig.spec.json

      - name: Typecheck (notifications lib)
        run: pnpm exec tsc --noEmit -p libs/notifications/tsconfig.spec.json

      - name: Typecheck (audit lib)
        run: pnpm exec tsc --noEmit -p libs/audit/tsconfig.spec.json

      - name: Typecheck (telemetry lib)
        run: pnpm exec tsc --noEmit -p libs/telemetry/tsconfig.spec.json

      - name: Typecheck (analytics lib)
        run: pnpm exec tsc --noEmit -p libs/analytics/tsconfig.spec.json

      - name: Typecheck (auth lib)
        run: pnpm exec tsc --noEmit -p libs/auth/tsconfig.spec.json

      - name: Typecheck (tenancy lib)
        run: pnpm exec tsc --noEmit -p libs/tenancy/tsconfig.spec.json

      - name: Typecheck (executor lib)
        run: pnpm exec tsc --noEmit -p libs/executor/tsconfig.spec.json

      # Production build — catches issues jest never sees (e.g. test files
      # leaking into the app compile). Must run after prisma generate.
      - name: Build (registry)
        run: pnpm exec nx build registry

      - name: Build (orchestrator)
        run: pnpm exec nx build orchestrator

      - name: Unit + integration tests (registry)
        run: pnpm exec jest --config apps/registry/jest.config.ts --ci

      - name: Unit tests (llm lib)
        run: pnpm exec jest --config libs/llm/jest.config.ts --ci

      - name: Unit tests (agent lib)
        run: pnpm exec jest --config libs/agent/jest.config.ts --ci

      - name: Unit tests (workflow lib)
        run: pnpm exec jest --config libs/workflow/jest.config.ts --ci

      - name: Unit tests (orchestrator)
        run: pnpm exec jest --config apps/orchestrator/jest.config.ts --ci

      - name: Unit tests (mcp lib)
        run: pnpm exec jest --config libs/mcp/jest.config.js --ci

      - name: Unit tests (github-mcp lib)
        run: pnpm exec jest --config libs/github-mcp/jest.config.js --ci

      - name: Unit tests (secrets lib)
        run: pnpm exec jest --config libs/secrets/jest.config.ts --ci

      - name: Unit tests (planning lib)
        run: pnpm exec jest --config libs/planning/jest.config.ts --ci

      - name: Unit tests (sandbox lib)
        run: pnpm exec jest --config libs/sandbox/jest.config.ts --ci

      - name: Unit tests (coding-agent lib)
        run: pnpm exec jest --config libs/coding-agent/jest.config.ts --ci

      - name: Unit tests (review-agent lib)
        run: pnpm exec jest --config libs/review-agent/jest.config.ts --ci

      - name: Unit tests (testing-agent lib)
        run: pnpm exec jest --config libs/testing-agent/jest.config.ts --ci

      - name: Unit tests (deployment-agent lib)
        run: pnpm exec jest --config libs/deployment-agent/jest.config.ts --ci

      - name: Unit tests (approvals lib)
        run: pnpm exec jest --config libs/approvals/jest.config.ts --ci

      - name: Unit tests (notifications lib)
        run: pnpm exec jest --config libs/notifications/jest.config.ts --ci

      - name: Unit tests (audit lib)
        run: pnpm exec jest --config libs/audit/jest.config.ts --ci

      - name: Unit tests (telemetry lib)
        run: pnpm exec jest --config libs/telemetry/jest.config.ts --ci

      - name: Unit tests (analytics lib)
        run: pnpm exec jest --config libs/analytics/jest.config.ts --ci

      - name: Unit tests (auth lib)
        run: pnpm exec jest --config libs/auth/jest.config.ts --ci

      - name: Unit tests (tenancy lib)
        run: pnpm exec jest --config libs/tenancy/jest.config.ts --ci

      - name: Unit tests (executor lib)
        run: pnpm exec jest --config libs/executor/jest.config.ts --ci
