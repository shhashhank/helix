name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: lint + typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (registry)
        run: pnpm exec prisma generate --schema apps/registry/prisma/schema.prisma

      - name: Unit + integration tests
        run: pnpm exec jest --config apps/registry/jest.config.ts --ci
